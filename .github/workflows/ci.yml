name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # `npm test` runs the .ts files via `node --test`, which needs native
          # TypeScript type-stripping (default-on in Node 23.6+/24). Node 20 can't
          # load .ts and fails with ERR_UNKNOWN_FILE_EXTENSION.
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run type-check
      - run: npm run lint
      - run: npm test
      - run: npm run build --if-present
